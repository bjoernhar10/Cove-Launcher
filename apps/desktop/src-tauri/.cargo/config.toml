# Default build settings for the Cove core.

[env]
# Cove catalogue proxy (services/catalog-proxy, see docs/proxy.md). Not a secret: every Cove build
# contains it. An environment variable of the same name overrides it (e.g. a local `wrangler dev`):
#   COVE_CATALOG_PROXY_URL=http://127.0.0.1:8787 npm run dev
COVE_CATALOG_PROXY_URL = "https://cove-catalog-proxy.bjoernharter-github.workers.dev"
# Cove's Discord application (Discord status, src/discord.rs). Not a secret either; without it the
# Discord status switch is hidden.
COVE_DISCORD_CLIENT_ID = "1572233996539269120"
# Save sync through the user's cloud (src/savesync/cloud.rs). OAuth client ids are not secrets
# (desktop clients with PKCE); Google's client secret lives only in the proxy (GOOGLE_CLIENT_SECRET).
COVE_GOOGLE_CLIENT_ID = "316912259410-jc4htff7g5c04bpkdvrasr924u6rc5kc.apps.googleusercontent.com"
COVE_ONEDRIVE_CLIENT_ID = "4ed74ca6-8745-4e39-8beb-4ec0a421d750"
COVE_DROPBOX_CLIENT_ID = "60gl9nkd94jkhya"
