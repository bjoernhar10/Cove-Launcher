[package]
name = "cove"
version = "0.1.0"
description = "Cove — universal desktop game launcher"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "cove_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "process", "time", "sync", "fs", "net", "io-util"] }
thiserror = "2.0.21"
chrono = { version = "0.4.45", features = ["serde"] }
sysinfo = "0.36.1"
shlex = "2.0.1"
tauri-plugin-opener = "2.5.5"
reqwest = { version = "0.13.5", features = ["json", "query", "gzip", "stream"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "async-secret-service", "crypto-rust", "tokio"] }
async-trait = "0.1.92"
strsim = "0.11.1"
sha2 = "0.11.0"
percent-encoding = "2.3.2"
getrandom = "0.4.3"
base64 = "0.23.1"
zip = { version = "7.3.0", default-features = false, features = ["deflate", "deflate64", "bzip2", "lzma"] }
sevenz-rust2 = "0.20.2"
tar = "0.4.46"
flate2 = "1.1.10"
futures-util = "0.3.34"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-updater = "2.12.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "allow"
missing_panics_doc = "allow"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
jsonschema = "0.33.0"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "process", "time", "sync", "fs", "net", "io-util", "test-util"] }
wiremock = "0.6.5"
