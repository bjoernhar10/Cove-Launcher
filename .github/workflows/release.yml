# Desktop builds: Linux (AppImage, .deb, .rpm), Windows (MSI, NSIS) and
# macOS on Apple Silicon (.dmg, plus the .app archive for the updater; not
# signed with an Apple Developer ID yet).
#
# Every push to main builds all bundles and keeps them as workflow artifacts.
# A tag `v*` (e.g. v0.2.0) additionally creates a draft GitHub release with
# signed updater artifacts and `latest.json` for the Tauri updater.
#
# Run manually with `tag` (e.g. v0.2.2) to add builds to an existing release
# from the current branch; `platforms` limits it (e.g. only macOS).
#
# Secrets (Settings → Secrets and variables → Actions), only needed for tags:
#   TAURI_SIGNING_PRIVATE_KEY           contents of ~/.tauri/cove-updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password (empty for the generated key)
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Add the builds to this existing release (e.g. v0.2.2); empty = workflow artifacts only"
        required: false
        default: ""
      platforms:
        description: "Platforms to build"
        type: choice
        options: [all, linux, windows, macos]
        default: all

concurrency:
  group: build-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          PLATFORMS: ${{ inputs.platforms || 'all' }}
        run: |
          all='[
            {"platform":"linux","name":"Linux (AppImage, deb, rpm)","os":"ubuntu-22.04","bundles":"appimage,deb,rpm"},
            {"platform":"windows","name":"Windows (MSI, NSIS)","os":"windows-latest","bundles":"msi,nsis"},
            {"platform":"macos","name":"macOS Apple Silicon (dmg)","os":"macos-latest","bundles":"app,dmg"}
          ]'
          echo "matrix=$(jq -c --arg p "$PLATFORMS" 'map(select($p == "all" or .platform == $p))' <<<"$all")" >> "$GITHUB_OUTPUT"

  bundle:
    name: ${{ matrix.name }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Tauri system packages (+ clang for the Native AOT connectors)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev patchelf clang zlib1g-dev rpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: services/connectors/global.json
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"

      - run: npm ci

      # `beforeBuildCommand` builds both sidecars (PyInstaller, .NET) and the UI.
      - name: Build (workflow artifacts)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && !inputs.tag }}
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: apps/desktop
          args: --bundles ${{ matrix.bundles }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "cove-[platform]-[arch]-[bundle]"

      - name: Build and publish a draft release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.tag }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: Cove ${{ inputs.tag || github.ref_name }}
          releaseBody: See the commits since the previous release for what changed.
          # Tag pushes create a draft; a manual run with `tag` adds to that release
          # as it is (a draft lookup would miss a published one and open a new draft).
          releaseDraft: ${{ !inputs.tag }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          # The signatures are inside latest.json; no separate .sig downloads.
          uploadUpdaterSignatures: false
