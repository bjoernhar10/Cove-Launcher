# Desktop builds: Linux on x86_64 and ARM (AppImage, .deb, .rpm), Windows
# (MSI, NSIS) and macOS on Apple Silicon and Intel (.dmg, plus the .app archive
# for the updater; not signed with an Apple Developer ID yet). Every build runs
# natively on a runner of its architecture, so the sidecars (PyInstaller, .NET
# Native AOT) are built for it too.
#
# Every push to main builds all bundles and keeps them as workflow artifacts.
# A tag `v*` (e.g. v0.2.0) additionally creates one draft GitHub release with
# signed updater artifacts and `latest.json` for the Tauri updater.
#
# Run manually with `tag` (e.g. v0.2.2) to add builds to an existing release
# from the current branch; `platforms` limits it (e.g. only macOS).
# `macos-arm-on-intel` cross-compiles the Apple Silicon build on the Intel
# runner when GitHub has no arm64 macOS runners free (the recommender sidecar
# is then an x86_64 binary that runs through Rosetta).
#
# Secrets (Settings → Secrets and variables → Actions), only needed for tags:
#   TAURI_SIGNING_PRIVATE_KEY           contents of ~/.tauri/cove-updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password (empty for the generated key)
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Add the builds to this existing release (e.g. v0.2.2); empty = workflow artifacts only"
        required: false
        default: ""
      platforms:
        description: "Platforms to build"
        type: choice
        options: [all, linux, windows, macos, macos-arm-on-intel]
        default: all

concurrency:
  group: build-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      # One release for all builds: created here, before they run in parallel
      # (each build creating it itself left two drafts for v0.6.0).
      - id: release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n 1)
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f name="Cove $TAG" \
              -F draft=true -f body="Release notes follow." --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - id: matrix
        env:
          PLATFORMS: ${{ inputs.platforms || 'all' }}
        run: |
          all='[
            {"platform":"linux","name":"Linux (AppImage, deb, rpm)","os":"ubuntu-22.04","bundles":"appimage,deb,rpm"},
            {"platform":"linux","name":"Linux ARM (AppImage, deb, rpm)","os":"ubuntu-22.04-arm","bundles":"appimage,deb,rpm"},
            {"platform":"windows","name":"Windows (MSI, NSIS)","os":"windows-latest","bundles":"msi,nsis"},
            {"platform":"macos","name":"macOS Apple Silicon (dmg)","os":"macos-15","bundles":"app,dmg"},
            {"platform":"macos","name":"macOS Intel (dmg)","os":"macos-15-intel","bundles":"app,dmg"}
          ]'
          if [ "$PLATFORMS" = "macos-arm-on-intel" ]; then
            echo 'matrix=[{"platform":"macos","name":"macOS Apple Silicon (dmg, cross-built)","os":"macos-15-intel","bundles":"app,dmg","target":"aarch64-apple-darwin"}]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "matrix=$(jq -c --arg p "$PLATFORMS" 'map(select($p == "all" or .platform == $p))' <<<"$all")" >> "$GITHUB_OUTPUT"

  bundle:
    name: ${{ matrix.name }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Tauri system packages (+ clang for the Native AOT connectors)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev libudev-dev patchelf clang zlib1g-dev rpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: services/connectors/global.json
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"

      - run: npm ci

      # `beforeBuildCommand` builds both sidecars (PyInstaller, .NET) and the UI.
      - name: Build (workflow artifacts)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && !inputs.tag }}
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: apps/desktop
          args: --bundles ${{ matrix.bundles }}${{ matrix.target && format(' --target {0}', matrix.target) || '' }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "cove-[platform]-[arch]-[bundle]"

      - name: Build and publish a draft release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.tag }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: --bundles ${{ matrix.bundles }}${{ matrix.target && format(' --target {0}', matrix.target) || '' }} --config src-tauri/tauri.release.conf.json
          # The release the plan job created (draft) or found (a manual run with `tag`).
          releaseId: ${{ needs.plan.outputs.release_id }}
          tagName: ${{ inputs.tag || github.ref_name }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          # The signatures are inside latest.json; no separate .sig downloads.
          uploadUpdaterSignatures: false
