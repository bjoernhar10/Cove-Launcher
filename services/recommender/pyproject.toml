[project]
name = "cove-recommender"
version = "0.1.0"
description = "Cove recommendation service (JSON-RPC over stdio)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
cove-recommender = "cove_recommender.__main__:main"

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cove_recommender"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "ANN", "PT"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
